# Disetel untuk laptop RAM 4 GB: heap kecil, tanpa daemon/paralel, dan Kotlin
# dikompilasi in-process agar tidak ada daemon Kotlin terpisah yang kehabisan
# RAM (RMI timeout). Di mesin besar nilai ini tetap aman, hanya lebih lambat.
org.gradle.jvmargs=-Xmx1400m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.configureondemand=true
org.gradle.vfs.watch=false
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=256m
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false
